name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint import boundaries
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate migrations from zero
        run: npx tsx packages/db/src/cli/migrate.ts
        env:
          AVA_PGLITE_DIR: .pgdata-ci

      - name: Unit, integration and golden tests
        run: npm test

      - name: Build web
        run: npm run build:web

      - name: End-to-end
        run: npm run test:e2e

# No deployment. AVA V0 is local-first (ADR-22).
# No provider credentials are configured: the ADR-22 gate is open and the mock
# provider is the only registered provider, so CI makes no external model call.
